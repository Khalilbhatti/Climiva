# Local development database.
#
#   docker compose up -d postgres      start PostgreSQL (data survives restarts in the named volume)
#   docker compose down                stop it (keeps the data)
#   docker compose down -v             stop it and DELETE the data
#
# Only PostgreSQL runs here. The Next.js app runs on the host with `npm run dev`, so nobody needs to install
# PostgreSQL on their machine. Values come from `.env` (copy `.env.example`).
#
# The OWNER role below becomes the container's superuser: it is used for migrations and seeds only. The
# restricted runtime role `climvia_app` (the one Row Level Security applies to) is created by `npm run db:migrate`.
services:
  postgres:
    image: postgres:17-alpine
    container_name: climvia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-climvia}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-climvia_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Set POSTGRES_OWNER_PASSWORD in .env (copy .env.example)}
    ports:
      # Bound to loopback so the database is never reachable from the local network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - climvia-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  climvia-pgdata:
